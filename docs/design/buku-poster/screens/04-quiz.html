<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Carakan · Buku Poster quiz</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="fonts/fonts.css">
</head>
<body>


<style>
body{margin:0}
a{color:#2F3456}a:hover{color:#4A5590}
.jv{font-family:'Noto Sans Javanese',sans-serif}
.hand{font-family:'Patrick Hand',cursive}
.ruled{background-color:#F7F3EA;background-image:repeating-linear-gradient(to bottom, transparent 0, transparent 35px, #DAE3EC 35px, #DAE3EC 36px)}
</style>

<div class="ruled" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; font-family: 'Bricolage Grotesque', system-ui, sans-serif; color: #2F3456; display: flex; flex-direction: column">

<div style="padding: 18px; display: flex; align-items: center; gap: 12px">
<a href="01-learn-path.html" aria-label="Close quiz" style="width: 44px; height: 44px; box-sizing: border-box; border: 2px solid #2F3456; background: #F7F3EA; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2F3456" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</a>
<div style="flex: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
<div style="height: 12px; border: 2px solid #2F3456; background: #2F3456"></div>
<div style="height: 12px; border: 2px solid #2F3456; background: #F7F3EA"></div>
<div style="height: 12px; border: 2px solid #2F3456; background: #F7F3EA"></div>
</div>
</div>

<div style="margin: 0 18px; height: 330px; background: #9DB0EF; border: 2px solid #2F3456; box-shadow: 5px 5px 0 #2F3456; position: relative; overflow: hidden; color: #2F3456">
<div style="position: absolute; top: -8px; right: 40px; width: 70px; height: 22px; background: rgba(246,207,99,0.85); transform: rotate(4deg)"></div>
<div style="position: absolute; left: 16px; top: 16px; font-size: 13px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase">Soal 1 · Bunyinya apa?</div>
<div class="jv" style="position: absolute; left: 0; right: 0; top: 40px; text-align: center; font-size: 190px; line-height: 1.25">ꦪ</div>
<div class="hand" style="position: absolute; left: 16px; bottom: 12px; font-size: 19px; transform: rotate(-2deg)">Pilih satu jawaban</div>
</div>

<div style="margin: 26px 18px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
<button style="height: 96px; border: 2px solid #2F3456; background: #FFFDF8; box-shadow: 3px 3px 0 #2F3456; font-family: inherit; font-size: 40px; font-weight: 800; color: #2F3456; letter-spacing: -0.03em">ha</button>
<button style="height: 96px; border: 2px solid #2F3456; background: #8FC9A8; box-shadow: 3px 3px 0 #2F3456; font-family: inherit; font-size: 40px; font-weight: 800; color: #2F3456; letter-spacing: -0.03em; position: relative">ya
<svg style="position: absolute; right: 6px; top: 6px" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2F3456" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></button>
<button style="height: 96px; border: 2px solid #2F3456; background: #FFFDF8; box-shadow: 3px 3px 0 #2F3456; font-family: inherit; font-size: 40px; font-weight: 800; color: #2F3456; letter-spacing: -0.03em">pa</button>
</div>

<div style="margin: 22px 18px 0; display: flex; align-items: center; gap: 14px">
<div style="width: 72px; height: 72px; flex: none; border-radius: 50%; border: 2px solid #9E4F3F; color: #9E4F3F; display: flex; align-items: center; justify-content: center; transform: rotate(-12deg); text-align: center; font-size: 17px; line-height: 1" class="hand">BENAR!</div>
<div class="hand" style="font-size: 21px; line-height: 1.15; color: #2F3456">ꦪ dibaca <b>ya</b>. Satu kelompok dengan pa dan ha.</div>
</div>

<a href="#" style="margin-top: auto; height: 68px; display: flex; align-items: center; justify-content: center; gap: 8px; background: #2F3456; color: #F7F3EA; font-weight: 800; font-size: 18px; text-decoration: none">Lanjut
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F7F3EA" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
</div>
